## PICOM CONFIG FILE BY CHRISTIAN

# crop-shadow-to-monitor=true;
crop-shadow-to-monitor=true;
shadow=true;
# radius 15 / offset -15,-12 made a ~8px halo you could barely see over the
# wallpaper; this one reaches ~24px and falls slightly down-right
shadow-radius=30;
shadow-opacity = 0.8;
shadow-offset-x=-27;
shadow-offset-y=-22;
shadow-exclude = [
#   "name = 'Notification'",
#   # "class_g = 'LibreWolf' && argb",
  "class_g = 'Firefox'",
  "class_g = 'Firefox' && argb",
#   # "class_g = 'LibreWolf' && window_type *= 'popup_menu'",
#   # "class_g = 'LibreWolf'",
#   # "class_g = 'google-chrome' && window_type *= 'utility'",
#   "class_g = 'thunar' && window_type *= 'utility'",
#   "class_g = 'Thunar' && window_type *= 'utility'",
  "class_g = 'Firefox' && window_type *= 'utility'",
  # "class_g = 'Firefox' && window_type = 'popup_menu'",
  "class_g = 'Conky'",
  "class_g = 'com.github.xournalpp.xournalpp'",
#   "class_g ?= 'Notify-osd'",
#   "class_g = 'Cairo-clock'",
  "_GTK_FRAME_EXTENTS",
  # "_GTK_FRAME_EXTENTS@:c",
  # "window_type = 'menu'",
  # "window_type = 'dropdown_menu'",
  # "window_type = 'popup_menu'",
  # "window_type = 'tooltip'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  # opt-in: only windows flagged by shadow-script.sh (floating / pseudo-tiled),
  # plus rofi, which is often not a bspwm-managed window at all
  "!_COMPTON_SHADOW = 1 && class_g != 'Rofi'",
  # "!_COMPTON_SHADOW = 0",
#   "class_g = 'Thunar'",
    # "window_type = 'toolbar'",
    # "window_type = 'utility'",
  "class_g = 'Polybar'",
];

# old fading (instant fade-in + 2-frame fade-out = a one-frame "blink"); replaced by animations below
fading = false;
# fading =true;
# fade-in-step = 1;
# fade-out-step = 0.5;
# fade-delta = 1; # it was 3
# fade-delta = 2.5; 
# fade-exclude = [];
# # no-fading-openclose = true;

# inactive-dim = 0.15;
# inactive-dim-fixed = true;
mark-ovredir-focused = true;
# inactive-opacity-override =true;
active-opacity = 1;
# inactive-opacity = 1;
frame-opacity = 1;
focus-exclude = ["class_g = 'Cairo-clock'", "class_g = 'zoom'"];
opacity-rule = ["90:class_g = 'Alacritty'", "100:class_g = 'zoom'"];

corner-radius =0;
# rounded-corners-exclude = [
#   "window_type = 'dock'",
#   "window_type = 'desktop'",
#   "window_type *= 'utility'",
#   "window_type = 'popup_menu'",
#     "class_g = 'Thunar'",
#     "name = 'Popup'",
#     "window_type = 'tooltip'"
# ];

blur =true;
blur-method = "dual_kawase";
blur-strength = 2.5;
blur-background = false;
blur-background-frame =true;
blur-background-exclude = [
  "window_type = 'desktop'",
  # "_GTK_FRAME_EXTENTS@:c",
  "_GTK_FRAME_EXTENTS",
  "window_type = 'dock'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'",
  "class_g = 'zoom'",
"window_type = 'desktop'",
    "window_type = 'utility'",
];
# blur-exclude = [
#   "class_g = 'zoom'"
# ];

backend = "glx";
vsync = true;
xrender-sync-fence = false;
mark-wmwin-focused = true;
detect-rounded-corners =true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true; # was false: redrew the whole screen every frame
# glx-no-stencil = true;
# glx-no-rebind-pixmap = true;
log-level = "warn";

wintypes:
{
  # popup_menu = {shadow = false};
  # utility = {shadow = false};
  popup_menu = {shadow =true};
  utility = {shadow = true};
  dropdown_menu = {shadow =true; opacity = 1.0; fade =true;};
  menu = {shadow = false, blur-background = false};
  dock = { shadow = false; clip-shadow-above =true; };
  dnd = { shadow = false; };
  # GTK apps (e.g. Zathura) use a see-through window format even when opaque, and picom
  # clipped their shadow away entirely. full-shadow draws it anyway (only floating windows get shadows).
  normal = { full-shadow = true; };
  # tooltip = { fade = false; shadow = false; opacity = 1.0; focus = true; full-shadow = false;};
  tooltip = { fade =true; shadow =true; opacity = 1.0; focus = true; };
  # blur-background = false;
};

# unredir-if-possible is true/false; it was given a list, so picom ignored it (= false).
# To let fullscreen windows bypass picom, set it to true and move the list to
# unredir-if-possible-exclude (windows that should stay composited).
unredir-if-possible = false;
# unredir-if-possible-exclude = [
#   "class_g = 'zoom'",
#   "class_g = 'LibreWolf'",
# ];



# rules = (
#   { match = "class_g = 'Rofi'"; full-shadow = true; },
# )

# smooth window effects (picom 12+), drawn on the GPU and only while something changes
animations = (
  { triggers = ["open", "show"];  preset = "appear";    duration = 0.13; scale = 1; },
  { triggers = ["close", "hide"]; preset = "disappear"; duration = 0.13; scale = 1; },
  { triggers = ["geometry"];      preset = "geometry-change"; duration = 0.18; },
)
