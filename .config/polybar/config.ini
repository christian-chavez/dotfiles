; ; optional mouse controls
; click-left = playerctl --player=spotify play-pause
; click-right = playerctl --player=spotify next
; click-middle = playerctl --player=spotify previous


[bar/pdftabs]
inherit = bar/example
monitor = HDMI-A-0
background = #cc000000
offset-y = 20pt
enable-ipc = true 
; enable-struts = false

modules-left = zathura-tabs
modules-right =
modules-center = 

[module/zathura-tabs]
type = custom/script
exec = $HOME/Documents/scripts/polytabs.sh
interval = 0.1
format-font = 3
