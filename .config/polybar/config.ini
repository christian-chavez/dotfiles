[bar/pdftabs]
inherit = bar/example
monitor = eDP
; monitor = HDMI-A-0
background = #cc000000
offset-y = 20pt
override-redirect = false
enable-ipc = true
enable-struts = true

modules-left = zathura-tabs
modules-right =
modules-center =

[module/zathura-tabs]
type = custom/script
exec = $HOME/.local/bin/polytabs.sh
interval = 0.5
format-font = 3
