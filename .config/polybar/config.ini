; palette lives in its own file so every module (and any other tool) shares it
include-file = colors.ini

[bar/example]
monitor = eDP
width = 100%
height = 20pt
radius = 0
offset-y = 0

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 1pt

border-size = 0pt
border-color = #00000000

padding-left = 0
; 0 so the clock's dark block can sit flush in the corner
padding-right = 0

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 =Iosevka:size=11.55;3
; font-0 =Iosevka Light:size=11.55;3
; font-0 =Google Sans Code:size=11.55;3
; font-0 =SF Pro Display:size=13;3
font-1 = FiraCode Nerd Font:size=12;1
font-2 =Iosevka:size=9;3

modules-left = xworkspaces
modules-right = systray memory cpu eth bluetooth wlan mic pulseaudio battery date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-name = bspwm
; wm-restack = generic
wm-restack = bspwm
; wm-restack = i3

;override-redirect = true
;
[bar/external]
monitor = HDMI-A-0
; modules-left = xworkspaces
inherit = bar/example
; only one bar may own the tray: drop systray on the external bar
modules-right = memory cpu eth bluetooth wlan mic pulseaudio battery date

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
label-monitor = %name%
label-focused = %name%
label-occupied = %name%
label-urgent = %name%!
label-empty = %name%

[module/systray]
type = internal/tray
; format-margin = 8pt
tray-spacing = 9pt

[module/xworkspaces]
type = internal/xworkspaces
pin-workspaces = true

label-active = %name%
label-active-background = ${colors.active-bg}
label-active-foreground = ${colors.active-fg}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

;[module/filesystem]
;type = internal/fs
;interval = 25

;mount-0 = /

;label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

;label-unmounted = %mountpoint% not mounted
;label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio
interval = 5
format-volume-prefix = "󰕾 "
; format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
label-volume = %percentage%
; label-volume = %percentage%%
label-muted = muted
label-muted-foreground = ${colors.disabled}
; right-click: Bluetooth device menu (connect/disconnect, turn on/off)
click-right = /home/christian/.local/bin/bt-menu &

[module/battery]
type = internal/battery
; label-discharging = %{F#63b1ff}Bat%{F-} %percentage%%
; label-discharging = %{F#ffffff}󰁹%{F-} %percentage%%
; label-discharging = 󰁹 %percentage%%
label-discharging = 󰁹%{O4}%percentage%
; format-discharging = <label-discharging>
label-low = 󰂃%{O4}%percentage%
label-low-foreground = ${colors.warn}
;label-full = FULL
label-charging = 󰂄%{O4}%percentage%
label-charging-foreground = ${colors.good}
format-low = <label-low><animation-low>
animation-low-0 =
animation-low-0-foreground = ${colors.warn}
low-at = 15
full-at = 100
battery = BAT1
adapter = ACAD
poll-interval = 5

;[module/xkeyboard]
;type = internal/xkeyboard
;blacklist-0 = num lock
;
;label-layout = %layout%
;label-layout-foreground = ${colors.primary}
;
;label-indicator-padding = 2
;label-indicator-margin = 1
;label-indicator-foreground = ${colors.background}
;label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 5
format-prefix = "RAM"
format-prefix-foreground = ${colors.disabled}
label = %{O1}%percentage_used:3%%
label-foreground = ${colors.disabled}

[module/cpu]
type = internal/cpu
interval = 5
format-prefix = "CPU"
format-prefix-foreground = ${colors.disabled}
label = %{O1}%percentage:3%%
label-foreground = ${colors.disabled}

[module/mic]
type = custom/script
exec = /home/christian/.local/bin/mic-status --watch
tail = true
format-font = 2
click-left = pactl set-source-mute @DEFAULT_SOURCE@ toggle

[network-base]
type = internal/network
interval = 3
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %ifname%
label-disconnected-foreground = ${colors.disabled}

[module/wlan]
inherit = network-base
interface-type = wireless

# white icon + signal when connected; grey (inherited) when off
label-connected = %{A1:nmcli radio wifi off:}󰤨%{O10}%{T-}%signal%%{A}

label-disconnected = %{A1:nmcli radio wifi on:}󰤫%{O10}%{T-}00%{A}

label-connected-font = 2

[module/eth]
inherit = network-base
interface-type = wired
; label-connected = %ifname% %local_ip%
label-connected = 󰈀%{O4}
label-connected-foreground = ${colors.primary}
label-disconnected =

[module/bluetooth]
type = custom/script
; --watch + tail: event-driven, updates instantly on connect/disconnect/toggle
exec = /home/christian/.local/bin/bt-status --watch
tail = true
format-font = 2
; left-click: toggle the adapter on/off  right-click: rofi device menu
click-left = /home/christian/.local/bin/bt-toggle &
click-right = /home/christian/.local/bin/bt-menu &

[module/date]
type = internal/date
interval = 1
; date = %a %F %{F#C5C8C6}%H:%M:%S%{F-}
; date= %a %F %{F#C5C8C6}%H:%M:%S%{F-}
; polybar does NOT expand ${colors.*} inside %{F}/%{B} markup, so these are
; literal:  #63b1ff = colors.primary   #e6000000 = colors.clock-bg
; %{B..}..%{B-} puts the darker block behind the time only, not the date
date= %{F#63b1ff}%a%{F-} %F %{B#e6000000} %H:%M:%S %{B-}
; date-alt =%a %F %{F#C5C8C6}%H:%M%{F-}
label = "%{A3:gsimplecal:}%date%%{A}"
; label-foreground = ${colors.primary}
#click-right = $HOME/.config/polybar/modules/popup-calendar.sh --popup &

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini



