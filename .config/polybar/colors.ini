;==========================================================
;   Polybar palette — single source of truth.
;   Pulled into config.ini with `include-file = colors.ini`.
;   Transparency / AARRGGBB reference:
;   https://gist.github.com/lopspower/03fb1cc0ac9f32ef38f4
;==========================================================

[colors]
; --- surfaces ---
; ~75% black; the bar itself
background     = #bf0d0c0c
; pale grey block (currently unused, kept for reference)
background-alt  = #373B41
; ~90% black block behind the clock time
clock-bg       = #e6000000

; --- focused workspace pill ---
; primary at ~80% alpha so the bar bleeds through and softens the fill
active-bg      = #cc63b1ff
active-fg      = #0d0c0c

; --- text ---
foreground     = #d1d1d1
; muted grey: every "inactive / off" state and the ambient RAM/CPU stats
disabled       = #707880

; --- accents ---
; the one blue: ethernet icon, bluetooth-when-connected, date weekday
primary        = #63b1ff
secondary      = #a3be8c
; brick red, used as a background (urgent workspace)
alert          = #A54242
; bright red, used as a foreground (low battery)
warn           = #ff3131
; green foreground (battery charging)
good           = #90EE90
