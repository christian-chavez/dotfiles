## Make the laptop's internal speakers the preferred default sink.
##
## Without this, when the Bluetooth headphones disconnect WirePlumber's
## automatic default-sink election picks the HDMI/DP pro-audio output
## (alsa_output.pci-0000_04_00.1.pro-output-3, priority.session 1196) instead
## of the internal speakers (alsa_output.pci-0000_04_00.6.analog-stereo,
## priority.session 1009), because that output has the higher priority.
##
## Raising the internal analog output's session priority above the HDMI/DP
## output makes it win the election whenever nothing higher-priority is
## explicitly selected -- i.e. it becomes the fallback after a Bluetooth
## disconnect. You can still pick any other sink manually at any time.
##
## Revert: remove this file and `systemctl --user restart wireplumber`.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.pci-0000_04_00.6.analog-stereo" }
    ]
    actions = {
      update-props = {
        priority.session = 2000
      }
    }
  }
]
