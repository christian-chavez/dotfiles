## Auto-switch the default audio sink to a Bluetooth output when it connects.
##
## This merges into the stock "main" profile (it does not replace it) and
## appends one component to wireplumber.components.
##
## Script: ~/.local/share/wireplumber/scripts/bluez-autoswitch-default.lua
## Revert: remove this file and the script, then `systemctl --user restart wireplumber`.

wireplumber.profiles = {
  main = {
    script.bluez-autoswitch-default = required
  }
}

wireplumber.components = [
  {
    name = bluez-autoswitch-default.lua, type = script/lua
    provides = script.bluez-autoswitch-default
  }
]
