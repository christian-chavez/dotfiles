[[mgr.prepend_keymap]]
on = [ "m" ]
run = "plugin bookmarks save"
desc = "Save current position as a bookmark"

[[mgr.prepend_keymap]]
on = [ "'" ]
run = "plugin bookmarks jump"
desc = "Jump to a bookmark"

[[mgr.prepend_keymap]]
on = [ "b", "d" ]
run = "plugin bookmarks delete"
desc = "Delete a bookmark"

[[mgr.prepend_keymap]]
on = [ "b", "D" ]
run = "plugin bookmarks delete_all"
desc = "Delete all bookmarks"

[[mgr.prepend_keymap]]
on   = [ "t", "t" ]
run  = "plugin smart-tab"
desc = "Create a tab and enter the hovered directory"

[[mgr.prepend_keymap]]
on   = "2"
run  = "plugin smart-switch 1"
desc = "Switch or create tab 2"

[[mgr.prepend_keymap]]
on = "<C-n>"
# Patched dragon-drop (~/.local/src/dragon-bigicons): 128 px icons. One file: its icon. Several selected: one "N files" item that drags them all.
run = '''shell --orphan -- sh -c 'if [ $# -gt 1 ]; then exec "$HOME/.local/bin/dragon-drop" -x -T -A -s 128 "$@"; else exec "$HOME/.local/bin/dragon-drop" -x -i -T -s 128 "$@"; fi' _ %s'''
desc = "Drag selected files (or hovered) with dragon-drop"

[[mgr.prepend_keymap]]
on   = "<C-g>"
run  = 'shell -- rofi -theme fullscreen-preview -show filebrowser -filebrowser-command "ya emit reveal" -filebrowser-directory "$(pwd)"'
desc = "Grid view"

[[mgr.prepend_keymap]]
on  = "q"
run = "plugin confirm-quit"

# This tip lets you preview thumbnails in the current directory using Rofi, selecting an item reveals it in Yazi:
[[mgr.prepend_keymap]]
on   = "<C-g>"
run  = 'shell -- rofi -theme fullscreen-preview -show filebrowser -filebrowser-command "ya emit reveal" -filebrowser-directory "$(pwd)"'
desc = "Grid view"


[[mgr.prepend_keymap]]
on   = "T"
run  = 'shell --orphan -- alacritty --working-directory "$PWD"'
desc = "Open Alacritty here"

[[mgr.prepend_keymap]]
on = "<C-p>"
run = "shell -- xournalpp -p %h.pdf %h"
desc = "Export Xournal++ to PDF"

[[mgr.prepend_keymap]]
on   = "C"
run  = "plugin ouch zip"
desc = "Compress selected files to zip with ouch"
