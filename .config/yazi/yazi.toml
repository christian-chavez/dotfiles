# yazi.toml
[mgr]
ratio = [1, 3, 4]
show_hidden = false
show_symlink = true
sort_by = "mtime"
sort_reverse = true
sort_sensitive = true
sort_translit = true
linemode = "size_and_mtime"

[[opener.xournalpp]]
run = 'xournalpp %s'
desc = 'Open with Xournal++'
orphan = true
for = 'linux'

[[open.prepend_rules]]
url = '*.xopp'
use = 'xournalpp'

